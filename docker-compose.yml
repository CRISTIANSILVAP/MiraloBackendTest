services:
  app:
    image: miralo-backend:latest
    build:
      context: .
      dockerfile: Dockerfile
    container_name: miralo-app
    restart: unless-stopped
    ports:
      - "5000:5000"
    env_file:
      - .env
    environment:
      - MONGODB_URI=${MONGODB_URI}
      - JWT_SECRET=${JWT_SECRET}
      - WATCH_SYNC_MODE=${WATCH_SYNC_MODE:-memory}
      - PORT=5000
    networks:
      - miralo-net

networks:
  miralo-net:
    driver: bridge